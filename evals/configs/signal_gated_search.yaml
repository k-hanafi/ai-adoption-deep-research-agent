name: Signal Gated Search
cli_key: signal-gated-search
package: signal_gated_search
# FROZEN 2026-08-13: dig every signaled channel at high. Not 1=max.
# Card: .cursor/plans/sgs-design.md
# Bake-off effort: UAS xhigh, PCS 3× medium, SGS digs high.
scout_preset: low
scout_model: null  # stock low; optional model override later
dig_model: openai/gpt-5.6-luna
dig_max_steps: 50
dig_web_search_depth: medium
# Count still decides how many rooms to dig. Every dig is high.
dig_effort_by_count:
  1: high
  2: high
  3: high
escalate_all_signaled: true
rescue_enabled: false
max_digs_per_company: 3
signal_threshold: 0.5
# Legacy Ranked Top-1 fields kept for ablation / stub compat; not bake-off default.
dig_preset: null
rescue_dig_preset: null
rescue_threshold: 0.7
budget:
  max_usd_per_company: 0.25  # path headroom for up to 3× high-depth + scouts
  max_usd_per_experiment: 5.0
eval:
  k: 1
  panel: fixture_panel_v0
  dry_run: true
notes: >-
  FROZEN: 3× low presence scouts (channel source exists, NOT adoption smoke)
  → dig every signaled channel at high (not max). Luna digs steps=50 search=medium
  (PCS-matched leash). Rescue off. τ=0.5 provisional (moderate+). Bake-off: UAS
  xhigh, PCS 3× medium, SGS digs high. Contracts:
  prompts/signal_gated_search/scout_contracts.md. CLI defaults to dry-run.
  Pass --live for paid calls.
